name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v

      - name: Run study smoke
        run: python -m cfd_mesh_independence.study

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-study-outputs
          path: outputs/
          retention-days: 7
