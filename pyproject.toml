[project]
name = "cfd-mesh-independence"
version = "0.1.0"
description = "A mesh-independence study on a NACA 0012 airfoil with y+ monitoring."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Bakkar Rana", email = "bakkarranna@example.com"}
]
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
run-study = "cfd_mesh_independence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
